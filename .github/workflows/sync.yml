name: Upstream Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read-only upstream comparison
        run: |
          git remote add upstream https://github.com/senshinya/MoonTV.git
          git fetch --no-tags upstream main
          echo "Commits only in upstream (review manually; this workflow never writes main):"
          git log --oneline --no-merges HEAD..upstream/main --max-count=50
